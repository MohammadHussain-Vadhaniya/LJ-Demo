<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Template</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">Demo</a>
    </div>
  </nav>
  <main class="container">
    <h1 class="mb-3">HTML Demo Template</h1>
    <p class="lead">A simple starter page with Bootstrap and a tiny JS demo.</p>
    <div class="card mb-3">
      <div class="card-body">
        <button id="helloBtn" class="btn btn-success">Say Hello</button>
        <button id="countBtn" class="btn btn-outline-secondary ms-2">Click me</button>
        <span id="count" class="ms-2">0</span>
      </div>
    </div>
    <footer class="text-muted small">Created: February 19, 2026</footer>
  </main>
  <script>
    document.getElementById('helloBtn').addEventListener('click', ()=> alert('Hello from demo.html!'));
    let c = 0;
    document.getElementById('countBtn').addEventListener('click', ()=> {
      c++;
      document.getElementById('count').textContent = c;
    });
  </script>
</body>
</html>
